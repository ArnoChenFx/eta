# A `harmonyos-v*` tag builds the unsigned HarmonyOS / OpenHarmony 7.0 (API 26)
# HAP for `apps/mobile` and publishes it to a GitHub Release with SHA256SUMS.
# Manual runs (`workflow_dispatch`) build and upload the HAP as a workflow artifact.
name: Release HarmonyOS

on:
  push:
    tags: ["harmonyos-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: App version (defaults to apps/mobile/nsh.json)
        required: false
        default: ""
      build:
        description: App build number (defaults to apps/mobile/nsh.json)
        required: false
        default: ""

concurrency:
  group: release-harmonyos-${{ github.ref }}

permissions:
  contents: read

env:
  TAG: ${{ github.ref_name }}
  GH_REPO: ${{ github.repository }}
  OHOS_SDK_URL: https://repo.huaweicloud.com/openharmony/os/7.0-Release/ohos-sdk-windows_linux-public.tar.gz
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve version and build number
        id: meta
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ ! "$TAG" =~ ^harmonyos-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::A HarmonyOS release runs on a tag like harmonyos-v0.1.0, not on $GITHUB_REF."
              exit 1
            fi
            version="${TAG#harmonyos-v}"
            build="${{ github.run_number }}"
          else
            version="${{ inputs.version }}"
            build="${{ inputs.build }}"
            if [[ -z "$version" ]]; then
              version=$(jq -r '.version' apps/mobile/nsh.json)
            fi
            if [[ -z "$build" ]]; then
              build=$(jq -r '.build' apps/mobile/nsh.json)
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"

      - run: bun install --frozen-lockfile --ignore-scripts

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-ohos

      - uses: ./.github/actions/setup-nsh

      - name: Cache OpenHarmony 7.0 SDK (API 26)
        id: ohos-sdk
        uses: actions/cache@v4
        with:
          path: ~/ohos-sdk
          key: ohos-sdk-7.0-release-linux

      - name: Download OpenHarmony 7.0 SDK
        if: steps.ohos-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/ohos-sdk/stage ~/ohos-sdk/tmp
          curl -fsSL "$OHOS_SDK_URL" | tar -xz -C ~/ohos-sdk/tmp --wildcards '*linux/*-linux-*.zip'
          for z in $(find ~/ohos-sdk/tmp -name '*-linux-*.zip'); do
            unzip -qo "$z" -d ~/ohos-sdk/stage
          done
          rm -rf ~/ohos-sdk/tmp
          mv ~/ohos-sdk/stage ~/ohos-sdk/26.0.0

      - name: Cache hvigor
        id: hvigor
        uses: actions/cache@v4
        with:
          path: ~/hvigor
          key: ohos-hvigor-npm-v1

      - name: Install hvigor
        if: steps.hvigor.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/hvigor
          npm --prefix ~/hvigor install @ohos/hvigor @ohos/hvigor-ohos-plugin --registry https://repo.harmonyos.com/npm/

      - name: Cache Rust and NSH HarmonyOS build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.nsh/nshms
            apps/mobile/.nsh/platforms/harmonyos/target
            apps/mobile/.nsh/harmonyos/runner/target
          key: harmonyos-rust-${{ hashFiles('apps/mobile/nsh.lock', 'apps/mobile/native/Cargo.lock') }}
          restore-keys: |
            harmonyos-rust-

      - name: Align apps/mobile with installed nightly nsh and apply version
        run: |
          # Keep apps/mobile/native pinned to the installed nightly nsh revision.
          rev=$(nsh --version | sed -n 's/.*(\([0-9a-f]\{7,40\}\).*/\1/p')
          if [[ -n "$rev" ]]; then
            full_rev=$(gh api "repos/longbridge/nsh/commits/$rev" --jq .sha || echo "$rev")
            sed -i -E "s/rev = \"[0-9a-f]+\"/rev = \"$full_rev\"/g" apps/mobile/native/Cargo.toml
          fi
          tmp=$(mktemp)
          jq --arg v "${{ steps.meta.outputs.version }}" --argjson b "${{ steps.meta.outputs.build }}" \
            '.version = $v | .build = $b' apps/mobile/nsh.json > "$tmp"
          mv "$tmp" apps/mobile/nsh.json
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Prepare patched nsh-platform-harmonyos source
        run: |
          commit=$(jq -r '.packages[] | select(.name == "nsh-platform-harmonyos") | .commit' apps/mobile/nsh.lock)
          src="$RUNNER_TEMP/nsh-platform-harmonyos-src"
          rm -rf "$src"
          git clone https://github.com/huacnlee/nsh-platform-harmonyos.git "$src"
          git -C "$src" checkout "$commit"
          python3 apps/mobile/scripts/patch-harmonyos.py platform "$src"
          echo "NSH_HARMONYOS_SOURCE=$src" >> "$GITHUB_ENV"

      - name: Build native library and generate OpenHarmony project
        working-directory: apps/mobile
        run: |
          export OHOS_BASE_SDK_HOME="$HOME/ohos-sdk"
          export OHOS_NDK_HOME="$HOME/ohos-sdk/26.0.0"
          export HVIGOR_HOME="$HOME/hvigor"
          nsh package App.tsx --target harmonyos --runtime-os openharmony --no-hap -o "$RUNNER_TEMP/eta-mobile-harmonyos-out" -v

      - name: Assemble unsigned HAP with hvigor
        run: |
          export NODE_PATH="$HOME/hvigor/node_modules"
          export OHOS_BASE_SDK_HOME="$HOME/ohos-sdk"
          out="$RUNNER_TEMP/eta-mobile-harmonyos-out"
          python3 apps/mobile/scripts/patch-harmonyos.py project "$out"
          cd "$out"
          node "$HOME/hvigor/node_modules/@ohos/hvigor/bin/hvigor.js" assembleHap \
            --mode module -p product=default -p buildMode=release --no-daemon

      - name: Collect HAP and checksums
        run: |
          stage="$RUNNER_TEMP/harmonyos-release"
          mkdir -p "$stage"
          hap=$(find "$RUNNER_TEMP/eta-mobile-harmonyos-out/entry/build" -type f -name '*.hap' | head -n 1)
          test -f "$hap"
          name="Eta-mobile-${{ steps.meta.outputs.version }}-unsigned.hap"
          cp "$hap" "$stage/$name"
          (cd "$stage" && sha256sum "$name" > SHA256SUMS)
          ls -lh "$stage"

      - uses: actions/upload-artifact@v7
        with:
          name: eta-mobile-harmonyos-${{ steps.meta.outputs.version }}
          if-no-files-found: error
          path: ${{ runner.temp }}/harmonyos-release/*

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'harmonyos-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stage="$RUNNER_TEMP/harmonyos-release"
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft || echo none)
          if [[ "$draft" == "false" ]]; then
            echo "::error::$TAG is already published."
            exit 1
          fi
          if [[ "$draft" == "none" ]]; then
            previous=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" \
              --jq '.[] | select(.draft | not) | .tag_name' |
              grep -E '^harmonyos-v[0-9]' | grep -vxF "$TAG" | head -n 1 || true)
            notes=()
            if [[ -n "$previous" ]]; then notes+=(--notes-start-tag "$previous"); fi
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes "${notes[@]}" \
              --prerelease="$([[ "$TAG" == *-* && "${TAG#harmonyos-v}" == *-* ]] && echo true || echo false)"
          fi
          gh release upload "$TAG" "$stage"/* --clobber
          gh release edit "$TAG" --draft=false
